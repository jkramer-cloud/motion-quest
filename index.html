function nextExercise(){const s=st.session;if(!s)return;s.index++;if(s.index>=s.ids.length){finish();return;}s.remaining=X[s.ids[s.index]].seconds;s.transitioning=false;s.endsAt=Date.now()+s.remaining*1000;if(st.settings.transition){s.transitioning=true;s.remaining=5;s.endsAt=Date.now()+5000;}render();sound(830);if(!s.transitioning)voice(X[s.ids[s.index]].name)}
function tick(){const s=st.session;if(!s||st.page!=='workout'||s.paused)return;let now=Date.now();let guard=0;while(now>=s.endsAt&&st.session&&guard++<30){if(s.transitioning){s.transitioning=false;s.remaining=X[s.ids[s.index]].seconds;s.endsAt+=s.remaining*1000;render();sound(860);voice(X[s.ids[s.index]].name)}else{const oldEnds=s.endsAt;nextExercise();if(!st.session)return;const newS=st.session;newS.endsAt=oldEnds+(newS.transitioning?5000:newS.remaining*1000);}}
if(!st.session)return;const r=Math.max(0,Math.ceil((s.endsAt-now)/1000));if(s.remaining!==r){s.remaining=r;const clock=$('#clock');if(clock)clock.textContent=formatClock(r);const arc=$('.meter');if(arc){const x=activeExercise(),max=s.transitioning?5:x.seconds;arc.style.strokeDashoffset=String(565.487*(1-r/max));arc.style.stroke=r>30?'var(--mint)':r>10?'var(--yellow)':'var(--red)'}const sub=$('#remaining-session');if(sub){const used=s.ids.slice(0,s.index).reduce((a,id)=>a+X[id].seconds,0)+(!s.transitioning?X[s.ids[s.index]].seconds-r:0);sub.textContent=`${formatClock(Math.max(0,s.total-used))} of movement left`;}if([3,2,1].includes(r))sound(r===1?1000:650,.04)}}
function finish(){const s=st.session;if(!s)return;let seconds=s.total;const record={id:Date.now(),date:dateKey(),time:new Date().toISOString(),mode:s.mode,seconds,count:s.ids.length,before:s.before,after:null};st.history.push(record);persist();st.finished=record;st.session=null;st.page='completion';st.after=null;render();sound(1000,.25);voice('Quest complete! Well done.');window.scrollTo(0,0)}
function pause(){const s=st.session;if(!s)return;if(s.paused){s.paused=false;s.endsAt=Date.now()+s.remaining*1000;voice('Keep going')}else{s.paused=true;s.remaining=Math.max(0,Math.ceil((s.endsAt-Date.now())/1000))}render()}
function restart(){const s=st.session;if(!s)return;s.transitioning=false;s.remaining=X[s.ids[s.index]].seconds;s.endsAt=Date.now()+s.remaining*1000;s.paused=false;render();sound(720)}
function endEarly(){const s=st.session;if(!s)return;if(confirm('End this workout early? Partial sessions are not added to the completed-workout history.')){st.session=null;st.page='home';render()}}
function download(name,data,type='application/json'){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportData(){download('motion-quest-backup-'+dateKey()+'.json',JSON.stringify({app:'Motion Quest',version:1,exportedAt:new Date().toISOString(),guide:st.guide,settings:st.settings,levels:st.levels,history:st.history},null,2))}
function report(){const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-6),from=dateKey(start),to=dateKey(d);const h=st.history.filter(t=>t.date>=from&&t.date<=to);const total=Math.round(h.reduce((a,r)=>a+r.seconds,0)/60),dates=new Set(h.map(v=>v.date)).size;const lines=['MOTION QUEST — MY MOVEMENT REPORT',`Report period: ${from} to ${to}`,'',`Completed sessions: ${h.length}`,`Movement minutes: ${total}`,`Days active: ${dates} of 7`,'','Completed workouts:',...h.map(v=>`${v.date} | ${MODES[v.mode]?.title||v.mode} | ${formatClock(v.seconds)}${v.after?' | '+(v.before===null?'Energy '+v.after:'Energy '+v.before+' → '+v.after):''}`),'','This report was generated from browser-local data. It is self-reported and not independently verified.','No account or student identity is collected by the app.'];download('motion-quest-weekly-report-'+dateKey()+'.txt',lines.join('\n'),'text/plain')}
async function importBackup(file){try{if(file.size>2000000)throw Error('File is too large.');const obj=JSON.parse(await file.text());if(obj.app!=='Motion Quest'||!Array.isArray(obj.history))throw Error('This is not a valid Motion Quest backup.');if(!confirm('Import this backup? It will replace the progress and preferences on this device.'))return;st.history=obj.history.filter(h=>typeof h.date==='string'&&Number.isFinite(h.seconds)&&h.seconds>=0&&typeof h.mode==='string').slice(-20000);st.guide=(obj.guide==='auto'||C[obj.guide])?obj.guide:'auto';st.levels=obj.levels&&typeof obj.levels==='object'?obj.levels:{};st.settings={sound:true,voice:false,transition:false,reducedMotion:false,...(obj.settings||{})};persist();alert('Backup imported.');navigate('progress')}catch(e){alert('Import unsuccessful: '+e.message)}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-action],[data-nav],[data-energy],[data-before]');if(!n)return;if(n.dataset.before){st.before=+n.dataset.before;render();return}if(n.dataset.energy){if(!st.finished)return;st.after=+n.dataset.energy;st.finished.after=st.after;const last=st.history.find(h=>h.id===st.finished.id);if(last)last.after=st.after;persist();render();return}const action=n.dataset.action||(n.dataset.nav?'nav:'+n.dataset.nav:'');if(action.startsWith('nav:')){navigate(action.slice(4));return}if(action.startsWith('guide:')){st.guide=action.slice(6);persist();render();return}if(action.startsWith('start:')){start(action.slice(6));return}switch(action){case'pause':pause();break;case'next':nextExercise();break;case'restart':restart();break;case'end':endEarly();break;case'export':exportData();break;case'report':report();break;case'import':$('#import-file')?.click();break;case'clear':if(confirm('Erase all Motion Quest progress, preferences and exercise choices on this device? This cannot be undone without a backup.')){localStorage.removeItem(STORE);st.history=[];st.guide='auto';st.levels={};st.settings={sound:true,voice:false,transition:false,reducedMotion:false};render()}break}});
document.addEventListener('change',e=>{if(e.target.dataset.setting){st.settings[e.target.dataset.setting]=e.target.checked;persist();render()}if(e.target.dataset.level){const id=e.target.dataset.level;if(X[id]?.variations){st.levels[id]=Math.min(X[id].variations.length-1,Math.max(0,+e.target.value||0));persist();render()}}if(e.target.id==='import-file'&&e.target.files?.[0])importBackup(e.target.files[0])});
window.addEventListener('keydown',e=>{if(st.page==='workout'&&e.code==='Space'&&!['BUTTON','INPUT','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();pause()}});
setInterval(tick,200);render();
</script>
</body></html>
